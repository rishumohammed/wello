# docker-compose.prod.yml
# ==============================================================================
# Wello Production Orchestration with Zero External Database Port Exposure
# ==============================================================================
# Security Policy:
#  1. MySQL (3306) and Redis (6379) are strictly isolated on the internal 'wello_prod_network'.
#     No published host ports are allowed for database or caching engines.
#  2. Backend operates with two instances (backend_1, backend_2) behind Nginx upstream
#     with passive failover and health probes.
#  3. Only Nginx reverse proxy publishes public ingress ports (80 HTTP, 443 HTTPS/TLS 1.3).

services:
  # ─── 1. Primary MySQL 8.0 Relational Database (Internal Network Only) ────────
  mysql:
    image: mysql:8.0
    container_name: wello_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-wello}
      MYSQL_USER: ${DB_USER:-wello_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/init_least_privilege.sql:/docker-entrypoint-initdb.d/01_least_privilege.sql:ro
    networks:
      - wello_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-wello_app}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # CRITICAL: No published host ports allowed in production

  # ─── 2. Redis 7 In-Memory Cache & Lock Manager (Internal Network Only) ───────
  redis:
    image: redis:7-alpine
    container_name: wello_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - wello_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # CRITICAL: No published host ports allowed in production

  # ─── 3. Backend Instance 1 (Nitro / Node 20 API Engine) ─────────────────────
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wello_backend_prod_1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      INSTANCE_ID: backend_instance_1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-wello_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-wello}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://wello.app}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - uploads_prod_data:/app/uploads
      - backups_prod_data:/app/backups
    networks:
      - wello_prod_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ─── 4. Backend Instance 2 (Nitro / Node 20 API Engine) ─────────────────────
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wello_backend_prod_2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      INSTANCE_ID: backend_instance_2
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-wello_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-wello}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_HMAC_SECRET: ${AUTH_HMAC_SECRET}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://wello.app}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - uploads_prod_data:/app/uploads
      - backups_prod_data:/app/backups
    networks:
      - wello_prod_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ─── 5. Frontend Client Application (Nuxt 3 SSR) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wello_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api
    networks:
      - wello_prod_network
    depends_on:
      - backend_1
      - backend_2

  # ─── 6. Nginx Reverse Proxy & TLS Ingress ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: wello_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - wello_prod_network
    depends_on:
      - backend_1
      - backend_2
      - frontend

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  uploads_prod_data:
    driver: local
  backups_prod_data:
    driver: local

networks:
  wello_prod_network:
    driver: bridge
