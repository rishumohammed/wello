# nginx/default.conf
# ==============================================================================
# Wello High-Availability Nginx Reverse Proxy Configuration
# ==============================================================================

# ─── Dual Backend Upstream with Passive Failover ─────────────────────────────
upstream backend_upstream {
    server backend_1:3001 max_fails=3 fail_timeout=10s;
    server backend_2:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ─── HTTP Port 80 Server Block (ACME Challenge & TLS Redirect) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name wello.app www.wello.app localhost _;

    # Let's Encrypt / Certbot ACME challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Port 443 Server Block (Production TLS 1.3 & Hardened Headers) ─────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wello.app www.wello.app localhost;

    # SSL Certificate Paths (Certbot / Custom TLS)
    ssl_certificate /etc/letsencrypt/live/wello.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wello.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/wello.app/chain.pem;

    # Modern TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Maximum payload upload size for logos and attachments
    client_max_body_size 10M;

    # ─── Comprehensive Security Headers ──────────────────────────────────────
    # HSTS: Enabled for 2 years with subdomains and preload commitment
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none';" always;

    # ─── API & Backend Proxying with Resilient Passive Failover ───────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
    }

    # ─── Static Nuxt Assets Long-Term Caching ────────────────────────────────
    location /_nuxt/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ─── Frontend Nuxt 3 Client Web App ──────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ─── Static Files & Metadata ─────────────────────────────────────────────
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
